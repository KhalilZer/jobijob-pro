services:
  # =========================
  # KEYCLOAK
  # =========================
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    container_name: jobipro-keycloak

    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin

    command: start-dev

    ports:
      - "8180:8080"

  # =========================
  # USER SERVICE DATABASE
  # =========================
  user-db:
    image: postgres:18.4-alpine3.24
    container_name: jobipro-user-db

    environment:
      POSTGRES_DB: user_service_db
      POSTGRES_USER: jobipro
      POSTGRES_PASSWORD: jobipro

    ports:
      - "5433:5432"

    volumes:
      - user_db_data:/var/lib/postgresql

  # =========================
  # MINIO / S3 Storage
  # =========================
  minio:
    image: minio/minio:latest
    container_name: jobipro-minio
    environment:
      MINIO_ROOT_USER: jobipro
      MINIO_ROOT_PASSWORD: jobipro123
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  user_db_data:
  minio_data:
