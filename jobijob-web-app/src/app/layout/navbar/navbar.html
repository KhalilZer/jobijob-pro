<div>
  <div class="flex justify-between">
    <div>LOGO</div>

    <div>
      <ul class="flex gap-2">
        <li>find a worker</li>
        <li>how it works</li>
        <li>for business</li>
        <li>about</li>
      </ul>
    </div>
    <div class="flex gap-2">
      <div>Lang</div>
      <div>notif</div>

      <div>
        @if (!isAuthenticated) {
          <button (click)="login()">Login</button> / <button (click)="register()">register</button>
        } @else {
          @if (connectedUser()?.userProfile; as user) {
            <img [src]="user.photoUrl" alt="" class="h-10 w-10" />
            {{ user.fullName }}
            <button (click)="logout()">Logout</button>
          }
        }
      </div>
    </div>
  </div>
</div>
