server:
  port: 8082

spring:
  application:
    name: COMPANY-SERVICE

  datasource:
    url: jdbc:postgresql://localhost:5434/company_service_db
    username: jobipro
    password: jobipro
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/jobijob-pro

eureka:
  instance:
    hostname: localhost
    prefer-ip-address: false

  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
